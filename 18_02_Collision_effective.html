        <!-- [오른쪽] 대형 2D 시뮬레이션 인터랙티브 실험실 (왼쪽 카드 높이와 동일하게 lg:h-[540px] 처리) -->

                    <!-- Right: Vertical Energy Monitor Panel (h-full로 왼쪽 캔버스와 완벽 매치) -->

                                <div class="border-b border-slate-800/60 w-full flex justify-between text-xs font-bold text-slate-600"><span>25</span></div>
                                <div class="w-full flex justify-between text-xs font-bold text-slate-600"><span>0</span></div>
                            </div>
                            
                            <!-- Bar 1: Total Energy (ε) -->
                            <div class="relative w-12 flex flex-col items-center h-full justify-end z-10">
                                <div id="bar-total-energy" class="w-full rounded-t bg-cyan-500/85 border border-cyan-400 shadow-[0_0_15px_rgba(6,182,212,0.4)] transition-all duration-150" style="height: 50%;"></div>
                                <span class="text-sm text-slate-300 mt-2 font-extrabold text-center whitespace-nowrap">총 에너지(ε)</span>

                            <!-- Bar 2: Effective Line Energy (ε_line) -->

                                <div id="bar-effective-energy" class="w-full rounded-t bg-amber-500/85 border border-amber-400 shadow-[0_0_15px_rgba(245,158,11,0.4)] transition-all duration-150" style="height: 30%;"></div>
                                <span class="text-sm text-slate-300 mt-2 font-extrabold text-center whitespace-nowrap">중심선(ε_line)</span>

                            <!-- Horizontal Threshold line: Activation Energy (ε_a) -->
                            <div id="line-barrier" class="absolute inset-x-0 border-t-2 border-dashed border-rose-500 z-20 pointer-events-none flex items-center justify-end pr-1 transition-all duration-150" style="bottom: 30%;">
                                <span class="bg-rose-950 text-rose-400 text-xs font-black px-2.5 py-1 rounded border border-rose-700 -mt-3.5 shadow-lg">장벽 ε_a</span>
                            </div>
                        </div>

    <!-- 푸터 -->
    <footer class="border-t border-slate-800 bg-slate-950/80 py-6 text-center text-xs text-slate-500 font-sans">

            <p>© 기체 반응 속도론 및 유효 반응 단면적 시각화 교육 자재</p>

    <!-- 로직 자바스크립트 소스 -->
    <script>
        // 1. 핵심 변수 및 DOM 초기 세팅
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');

        const sliderEnergy = document.getElementById('slider-energy');
        const sliderBarrier = document.getElementById('slider-barrier');
        const sliderB = document.getElementById('slider-b-val');

        const lblEnergy = document.getElementById('lbl-energy');
        const lblBarrier = document.getElementById('lbl-barrier');
        const lblBVal = document.getElementById('lbl-b-val');

        // 입자 지향 물리 데이터 설정
        let energy = parseInt(sliderEnergy.value);
        let barrier = parseInt(sliderBarrier.value);
        let bVal = parseInt(sliderB.value); // 조준 편차 a (Impact parameter)

        // 분자 A 및 B의 형태 정보 설정 (분자 크기 2배 적용: A=50px, B=60px)
        let moleculeA = { x: 100, y: 100, radius: 50, status: 'idle', startX: 100 };
        let moleculeB = { x: 450, y: 100, radius: 60 };
        const d_distance = moleculeA.radius + moleculeB.radius; // 총 충돌 한계 거리 d = 110 (50 + 60)

        let isLaunching = false;
        let isDragging = false;
        let explosionParticles = [];
        let simulationFeedbackText = "";
        let simulationFeedbackColor = "#94a3b8";
        let feedbackTimer = 0;

        // 캔버스 사이즈 디바이스 반응형 최적화
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth * window.devicePixelRatio;
            canvas.height = container.clientHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            const w = canvas.width / window.devicePixelRatio;
            const h = canvas.height / window.devicePixelRatio;
            
            // 두 분자 사이의 가로 간격을 극적으로 좁혀 빈 공간을 원천적으로 소거 (w의 32% ~ 68% 배치)
            moleculeA.startX = Math.round(w * 0.32);
            moleculeB.x = Math.round(w * 0.68); 
            moleculeB.y = h / 2;
            
            if (!isLaunching) {
                moleculeA.x = moleculeA.startX;
                moleculeA.y = moleculeB.y + bVal;
            }
            syncPhysics();
        }

        // 2. 물리 동기화 및 바 차트 갱신 연산
        function syncPhysics() {
            lblEnergy.innerText = energy;
            lblBarrier.innerText = barrier;
            lblBVal.innerText = `${bVal} px`;

            // 중심선 유효 에너지 실시간 공식 연산: ε_line = ε * (1 - a^2 / d^2)
            let effectiveEnergy = 0;
            if (Math.abs(bVal) <= d_distance) {
                effectiveEnergy = energy * (1 - (bVal * bVal) / (d_distance * d_distance));
            }

            // 우측 막대 그래프 데이터 연동
            const barTotal = document.getElementById('bar-total-energy');
            const barEffective = document.getElementById('bar-effective-energy');
            const lineBarrier = document.getElementById('line-barrier');

            barTotal.style.height = `${energy}%`;
            barEffective.style.height = `${Math.max(0, effectiveEnergy)}%`;
            lineBarrier.style.bottom = `${barrier}%`;

            // 활성화 장벽 임계 돌파 체크에 따른 색상 변경
            if (effectiveEnergy >= barrier) {
                barEffective.className = "w-full rounded-t bg-emerald-500/80 border border-emerald-400 shadow-[0_0_10px_rgba(16,185,129,0.3)] transition-all duration-150";
            } else {
                barEffective.className = "w-full rounded-t bg-amber-500/80 border border-amber-400 shadow-[0_0_10px_rgba(245,158,11,0.3)] transition-all duration-150";
            }

            if (!isLaunching) {
                moleculeA.y = moleculeB.y + bVal;
            }

            drawScene();
        }

        // 3. 메인 드로잉 렌더링 펑션 (한글 설명 및 이름 텍스트 완전 제거)
        function drawScene() {
            const w = canvas.width / window.devicePixelRatio;
            const h = canvas.height / window.devicePixelRatio;
            ctx.clearRect(0, 0, w, h);

            // 가로 세로 안내 배경 그리드
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 0.5;
            for (let x = 0; x < w; x += 30) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
            }
            for (let y = 0; y < h; y += 30) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
            }

            // 1. 전체 물리 닿기 충돌 거리 반경(d) 가이드라인 점선
            ctx.beginPath();
            ctx.arc(moleculeB.x, moleculeB.y, d_distance, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);

            // 2. 유효 반응 영역 (a_max = d * sqrt(1 - barrier/energy)) 계산 및 그리기
            let aMax = 0;
            if (energy >= barrier) {
                aMax = d_distance * Math.sqrt(1 - barrier / energy);
            }

            // 초록색 유효 반응 단면 영역 원 드로잉
            if (aMax > 0) {
                ctx.beginPath();
                ctx.arc(moleculeB.x, moleculeB.y, aMax, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(16, 185, 129, 0.13)';
                ctx.strokeStyle = 'rgba(16, 185, 129, 0.6)';
                ctx.lineWidth = 1.5;
                ctx.fill();
                ctx.stroke();
            }

            // 3. 분자 A의 비행 및 조준 가이드 선
            ctx.beginPath();
            ctx.moveTo(0, moleculeB.y + bVal);
            ctx.lineTo(w, moleculeB.y + bVal);
            ctx.strokeStyle = 'rgba(99, 102, 241, 0.15)';
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 3]);
            ctx.stroke();
            ctx.setLineDash([]);

            // 4. 타겟 분자 B 드로잉
            const gradB = ctx.createRadialGradient(
                moleculeB.x - moleculeB.radius * 0.3, moleculeB.y - moleculeB.radius * 0.3, moleculeB.radius * 0.1,
                moleculeB.x, moleculeB.y, moleculeB.radius
            );
            if (moleculeA.status === 'reacted') {
                gradB.addColorStop(0, '#fecdd3');
                gradB.addColorStop(0.7, '#f43f5e'); // 반응 성공 시 변색
                gradB.addColorStop(1, '#881337');
            } else {
                gradB.addColorStop(0, '#67e8f9');
                gradB.addColorStop(0.7, '#06b6d4'); // 청색
                gradB.addColorStop(1, '#083344');
            }
            ctx.beginPath();
            ctx.arc(moleculeB.x, moleculeB.y, moleculeB.radius, 0, Math.PI * 2);
            ctx.fillStyle = gradB;
            ctx.fill();
            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = 1;
            ctx.stroke();

            // 5. 비행 분자 A 드로잉
            const gradA = ctx.createRadialGradient(
                moleculeA.x - moleculeA.radius * 0.3, moleculeA.y - moleculeA.radius * 0.3, moleculeA.radius * 0.1,
                moleculeA.x, moleculeA.y, moleculeA.radius
            );
            gradA.addColorStop(0, '#fca5a5');
            gradA.addColorStop(0.7, '#ef4444'); // 적색
            gradA.addColorStop(1, '#991b1b');

            ctx.beginPath();
            ctx.arc(moleculeA.x, moleculeA.y, moleculeA.radius, 0, Math.PI * 2);
            ctx.fillStyle = gradA;
            ctx.fill();

            // 6. 비껴치기 기하학 구조 화살표 및 벡터 분석
            if (Math.abs(bVal) <= d_distance) {
                const contactXA = moleculeB.x - Math.sqrt(d_distance * d_distance - bVal * bVal);
                const contactYA = moleculeB.y + bVal;

                // 접촉 가상선 중심선 (A의 중심부터 B의 중심까지 연결되는선 d)
                ctx.beginPath();
                ctx.moveTo(contactXA, contactYA);
                ctx.lineTo(moleculeB.x, moleculeB.y);
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                // 중심선 중심부에 "d" 표기 (글씨 확대)
                ctx.fillStyle = '#94a3b8';
                ctx.font = "italic bold 15px 'Inter'";
                ctx.fillText("d", (contactXA + moleculeB.x)/2 - 10, (contactYA + moleculeB.y)/2 - 5);

                // 비껴치기 오프셋 수직 기둥선 (a) 그리기 (분자 크기 확장에 맞춰 오버랩되지 않도록 좀더 왼쪽인 -135로 이동 배치)
                ctx.beginPath();
                ctx.moveTo(moleculeB.x - 135, moleculeB.y);
                ctx.lineTo(moleculeB.x - 135, moleculeB.y + bVal);
                ctx.strokeStyle = '#818cf8';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // 틱 마크
                ctx.beginPath();
                ctx.moveTo(moleculeB.x - 139, moleculeB.y); ctx.lineTo(moleculeB.x - 131, moleculeB.y);
                ctx.moveTo(moleculeB.x - 139, moleculeB.y + bVal); ctx.lineTo(moleculeB.x - 131, moleculeB.y + bVal);
                ctx.stroke();

                // 기하학적 표시: 조준거리 "a" 기입 (글씨 확대)
                ctx.fillStyle = '#818cf8';
                ctx.font = "italic bold 16px 'Inter'";
                ctx.fillText(`a = ${Math.abs(bVal)} px`, moleculeB.x - 205, moleculeB.y + bVal/2 + 5);

                // 속도 벡터 (v_상대) 그리기
                const speedMagnitude = (energy / 100) * 120 + 30; // 분자가 커졌으므로 화살표 길이도 비례해 상향 조정
                ctx.beginPath();
                ctx.moveTo(contactXA, contactYA);
                ctx.lineTo(contactXA + speedMagnitude, contactYA);
                ctx.strokeStyle = 'rgba(239, 68, 68, 0.45)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // 중심선 방향 성분 (v_상대, A-B) 속도 투영
                const cosTheta = Math.sqrt(d_distance * d_distance - bVal * bVal) / d_distance;
                const projectedLen = speedMagnitude * cosTheta;
                
                // 중심선 성분 화살표 벡터 드로잉
                const angleToB = Math.atan2(-bVal, moleculeB.x - contactXA);
                ctx.beginPath();
                ctx.moveTo(contactXA, contactYA);
                ctx.lineTo(contactXA + Math.cos(angleToB) * projectedLen, contactYA + Math.sin(angleToB) * projectedLen);
                ctx.strokeStyle = '#34d399';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // 화살표 머리
                const arrowX = contactXA + Math.cos(angleToB) * projectedLen;
                const arrowY = contactYA + Math.sin(angleToB) * projectedLen;
                ctx.beginPath();
                ctx.moveTo(arrowX, arrowY);
                ctx.lineTo(arrowX - 7 * Math.cos(angleToB - 0.4), arrowY - 7 * Math.sin(angleToB - 0.4));
                ctx.lineTo(arrowX - 7 * Math.cos(angleToB + 0.4), arrowY - 7 * Math.sin(angleToB + 0.4));
                ctx.fillStyle = '#34d399';
                ctx.fill();

                // 각도 표시 θ (글씨 확대)
                ctx.beginPath();
                ctx.arc(contactXA, contactYA, 15, 0, angleToB, bVal < 0);
                ctx.strokeStyle = '#fbbf24';
                ctx.lineWidth = 1.2;
                ctx.stroke();
                
                ctx.fillStyle = '#fbbf24';
                ctx.font = "italic bold 17px 'Inter'";
                ctx.fillText("θ", contactXA + 20, contactYA + (bVal > 0 ? -4 : 12));
            }

            // 폭발 파티클 업데이트 및 렌더링
            if (explosionParticles.length > 0) {
                explosionParticles.forEach((p, idx) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= 0.02;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${p.color}, ${p.alpha})`;
                    ctx.fill();

                    if (p.alpha <= 0) {
                        explosionParticles.splice(idx, 1);
                    }
                });
            }

            // 실시간 충돌 피드백 상태 텍스트
            if (feedbackTimer > 0) {
                ctx.fillStyle = simulationFeedbackColor;
                ctx.font = "bold 22px 'Inter'";
                ctx.fillText(simulationFeedbackText, 30, 45);
                feedbackTimer--;
            }
        }

        // 3. 발사 및 충돌 판정 가동 애니메이션
        function launchMolecule() {
            if (isLaunching) return;
            isLaunching = true;
            
            const w = canvas.width / window.devicePixelRatio;
            moleculeA.startX = Math.round(w * 0.32);
            moleculeA.x = moleculeA.startX;
            moleculeA.status = 'flying';
            
            simulationFeedbackText = "이동 중...";
            simulationFeedbackColor = "#f59e0b";
            feedbackTimer = 999; // 대기 상태 유지

            const speed = (energy / 100) * 8 + 3; // 상대 속도 조절
            const d = moleculeA.radius + moleculeB.radius;
            
            let collisionX = moleculeB.x;
            if (d * d - bVal * bVal >= 0) {
                collisionX = moleculeB.x - Math.sqrt(d * d - bVal * bVal);
            }

            function step() {
                if (!isLaunching) return;

                // 스쳐 지나감 (아예 접촉 불가능)
                if (Math.abs(bVal) >= d) {
                    if (moleculeA.x < moleculeB.x + 100) {
                        moleculeA.x += speed;
                        drawScene();
                        requestAnimationFrame(step);
                    } else {
                        isLaunching = false;
                        moleculeA.status = 'missed';
                        simulationFeedbackText = "충돌 불발 (스쳐 지나감)";
                        simulationFeedbackColor = "#64748b";
                        feedbackTimer = 120; // 2초간 화면 노출
                    }
                    return;
                }

                // 접촉 지점 직전까지 전진
                if (moleculeA.x < collisionX) {
                    moleculeA.x += speed;
                    drawScene();
                    requestAnimationFrame(step);
                } else {
                    // 기하학적 유효 반경 aMax 판별
                    let aMax = 0;
                    if (energy >= barrier) {
                        aMax = d * Math.sqrt(1 - barrier / energy);
                    }

                    if (Math.abs(bVal) <= aMax) {
                        // 반응 성공! (Chemical Reaction)
                        moleculeA.x = collisionX;
                        moleculeA.status = 'reacted';
                        createExplosion(collisionX + 10, moleculeA.y);
                        simulationFeedbackText = "🎉 반응 성공! (에너지 장벽 극복)";
                        simulationFeedbackColor = "#10b981";
                        feedbackTimer = 180;
                        isLaunching = false;
                    } else {
                        // 단순 물리 튕김 (Elastic Bounce)
                        moleculeA.status = 'bounced';
                        triggerBounceBack(speed);
                        simulationFeedbackText = "💥 불발 (충돌 에너지가 장벽 미만)";
                        simulationFeedbackColor = "#ef4444";
                        feedbackTimer = 180;
                    }
                }
            }
            step();
        }

        // 단순 바운싱 물리 튕김 곡선 연출
        function triggerBounceBack(speed) {
            let tick = 0;
            const angle = Math.atan2(bVal, 40);
            const vx = -Math.cos(angle) * speed * 0.7;
            const vy = Math.sin(angle) * speed * 0.7;

            function bounce() {
                if (tick < 25) {
                    moleculeA.x += vx;
                    moleculeA.y += vy;
                    drawScene();
                    tick++;
                    requestAnimationFrame(bounce);
                } else {
                    isLaunching = false;
                }
            }
            bounce();
        }

        // 반응성 폭발 불꽃 입자 생성기
        function createExplosion(x, y) {
            explosionParticles = [];
            for (let i = 0; i < 25; i++) {
                const angle = Math.random() * Math.PI * 2;
                const sp = Math.random() * 4 + 1.5;
                explosionParticles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * sp,
                    vy: Math.sin(angle) * sp,
                    size: Math.random() * 3 + 1,
                    color: Math.random() > 0.5 ? '244, 63, 94' : '251, 191, 36', // rose or gold
                    alpha: 1.0
                });
            }
            function particleAnimate() {
                if (explosionParticles.length > 0) {
                    drawScene();
                    requestAnimationFrame(particleAnimate);
                }
            }
            particleAnimate();
        }

        // 4. 슬라이더 변경 사항 갱신 리스너
        function updateSliders() {
            energy = parseInt(sliderEnergy.value);
            barrier = parseInt(sliderBarrier.value);
            bVal = parseInt(sliderB.value);

            syncPhysics();
        }

        // 마우스로 빨간 분자 직접 드래그앤 드롭하는 물리 구현
        canvas.addEventListener('mousedown', (e) => {
            if (isLaunching) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (canvas.width / window.devicePixelRatio / rect.width);
            const mouseY = (e.clientY - rect.top) * (canvas.height / window.devicePixelRatio / rect.height);

            const dist = Math.hypot(moleculeA.x - mouseX, moleculeA.y - mouseY);
            if (dist < moleculeA.radius + 15) {
                isDragging = true;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging || isLaunching) return;
            const rect = canvas.getBoundingClientRect();
            const mouseY = (e.clientY - rect.top) * (canvas.height / window.devicePixelRatio / rect.height);
            const h = canvas.height / window.devicePixelRatio;

            let targetY = mouseY;
            if (targetY < h/2 - 110) targetY = h/2 - 110;
            if (targetY > h/2 + 110) targetY = h/2 + 110;

            bVal = Math.round(targetY - h/2);
            sliderB.value = bVal;
            
            syncPhysics();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        // 장면 리셋
        function resetScene() {
            isLaunching = false;
            explosionParticles = [];
            
            const w = canvas.width / window.devicePixelRatio;
            moleculeA.startX = Math.round(w * 0.32);
            moleculeA.x = moleculeA.startX;
            
            const h = canvas.height / window.devicePixelRatio;
            moleculeA.y = h / 2 + bVal;
            
            simulationFeedbackText = "실험 대기 중";
            simulationFeedbackColor = "#64748b";
            feedbackTimer = 120;
            
            syncPhysics();
        }

        sliderEnergy.addEventListener('input', updateSliders);
        sliderBarrier.addEventListener('input', updateSliders);
        sliderB.addEventListener('input', updateSliders);

        // 초기 시작 실행
        window.onload = function() {
            lucide.createIcons();
            resizeCanvas();
        };

        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
